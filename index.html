<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador y limitador de texto</title>
    <link rel="stylesheet" href=".//assets/css/style.css">
</head>

<body>
    <header>
        <h2>Escriba su Mensaje</h2>
    </header>
    <main>
        <div class="recuadro">
            <textarea name="mensaje" id="mensaje" placeholder="Escriba aqui" maxlength="250"></textarea>
            <span id="counter"> 0 / 250</span>
        </div>

    </main>
    <script src=".//assets/js/javaScript.js"></script>
</body>

</html>
